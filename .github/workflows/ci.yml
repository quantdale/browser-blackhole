name: CI

on:
  push:
    branches: [main]
  pull_request:

# O-03/2.1: least-privilege workflow token — the jobs only read the repo.
permissions:
  contents: read

# O-03/2.2: one in-flight run per ref; superseded pushes cancel.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    # Deterministic non-GPU gates only. A green run here says nothing about
    # GPU/WebGPU behavior (docs/CI_CD.md section 16).
    name: quality (format/lint/typecheck/unit/build)
    runs-on: ubuntu-latest
    # O-03/2.3: a hung job fails loudly instead of burning the six-hour cap.
    timeout-minutes: 30
    steps:
      # O-03/2.4: actions pinned to immutable commit SHAs (floating tags move);
      # Dependabot keeps the pins current (2.5).
      # v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          # O-03/2.7: pinned to a specific minor, not a floating major.
          node-version: 22.12.0
          cache: npm
      - name: Install from lockfile
        run: npm ci
      # archive-validation-gate 3.1: the hosted gate also runs both OpenSpec
      # validators — every active change and every archived change must pass
      # strict validation; a bare unchecked archived task fails the job.
      # Pin the CLI (installed as a global tool locally at this exact version);
      # a missing/failing invocation fails the job, it is never a silent pass.
      - name: Install OpenSpec CLI (pinned, used by the two gates below)
        run: npm install --global @fission-ai/openspec@1.9.0
      - name: Specification validation (strict, all active changes)
        run: openspec validate --all --strict
      - name: Specification validation (strict, all archived changes)
        run: openspec validate --archived --strict
      - name: Dependency audit gate (high+; see docs/DEPENDENCIES.md)
        run: npm audit --audit-level=high
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - name: Unit-test import-coverage report (report-only, D8/V-10)
        run: npm run coverage:report
      - name: Command-surface check (documented commands must exist)
        run: node scripts/check-command-surface.mjs
      # spatial-atlas-status-honesty + hosted-product-boot-coverage: these
      # repository checks run in the hosted quality job too (they are part of
      # `npm run check` locally, but this job invokes each step explicitly).
      - name: Implementation-status honesty (planning-complete is not implementation-complete)
        run: npm run check:status-honesty
      - name: Shared-shader / legacy-state boundary
        run: npm run check:shader-boundary
      - run: npm run build

  browser-smoke:
    # O-03/2.3: bounded job runtime.
    timeout-minutes: 30
    # Reliable hosted browser gate: two backend-agnostic Chromium rows on
    # software WebGL2 — the legacy M0 smoke and the product-entry smoke.
    #
    # WHY NOT THE FULL SUITE (behavioral/parity/golden): hosted
    # GitHub runners have no GPU, so every scene renders through software WebGL2
    # (SwiftShader) on 2 vCPUs. The heavy TSL lensing/Kerr shaders and the
    # full-screen hyperspace transition compile/render at seconds-per-frame, and
    # runner speed varies wildly run-to-run (a black-hole arrival measured
    # 18s in
    # one hosted run and >180s in another). No fixed timeout survives that
    # variance, so the full GPU suite CANNOT be a stable hosted gate — it is a
    # LOCAL capable-runner gate (docs/CI_CD.md sections 2, 7, 16; run it with
    # `npm run e2e` on a WebGPU-capable machine, plus `--project=firefox`).
    #
    # Row 1 — smoke.spec.ts boots the LEGACY root via ?legacy=1, which renders
    # the CHEAP diagnostic
    # gradient (no lensing/Kerr compile), plus the forced-WebGL2 gradient and
    # the
    # forced-unsupported terminal UX. It is backend-agnostic and cheap, so it is
    # stable on software WebGL2 while still proving: the app boots to a truthful
    # ready/fallback/unsupported terminal state, the WebGL2 fallback path
    # renders,
    # the canvas is non-zero, interaction/resize are safe, and the console/page
    # error channels stay clean (docs/CI_CD.md section 5). It is NOT a WebGPU or
    # full-scene validation.
    #
    # Row 2 — product-entry.spec.ts enters the BARE root (no legacy=1), asserts
    # the /atlas/black-hole redirect and the atlas shell, and accepts
    # ready/fallback/unsupported. It never reads a lensed pixel: host.init()
    # resolves at the ready stage BEFORE any frame renders, so its
    # ARRIVAL_TIMEOUT_MS ceiling (180s in CI, env-overridable) is a safety net
    # for a hung init, not an expected wait — it is the slowest-still-bounded
    # hosted step, and its own coverage assertion (expected 1) makes a skip fail.
    name: browser-smoke (Chromium, WebGL2 fallback; legacy + product-entry smoke)
    needs: quality
    runs-on: ubuntu-latest
    steps:
      # v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - name: Install pinned Playwright browser (Chromium)
        run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Playwright M0 smoke (backend-agnostic)
        run: >-
          npx playwright test --project=default --workers=1
          tests/browser/smoke.spec.ts
          --reporter=json > smoke-results.json
      - name: Assert smoke coverage (a skip is not a pass)
        run: node scripts/check-smoke-coverage.mjs smoke-results.json 5
      # staged-product-boot-coverage 2.4: the hosted browser job also executes
      # the product-entry check — atlas shell on the product route WITHOUT
      # legacy=1 (capability hosted-smoke-coverage). Broken out as its own
      # step with its own expected count so neither spec can pass into the
      # other's tally (design D3), with the same skip-honesty assertion.
      - name: Playwright product-entry smoke (atlas shell, no legacy=1)
        run: >-
          npx playwright test --project=default --workers=1
          tests/browser/product-entry.spec.ts
          --reporter=json > product-entry-results.json
      - name: Assert product-entry coverage (a skip is not a pass)
        run: node scripts/check-smoke-coverage.mjs product-entry-results.json 1
      - name: GC1 offline self-check + artifact freshness gate (pure-stdlib, D7)
        run: |
          python tools/cosmic-data/restricted_three_body.py
          git diff --exit-code tools/cosmic-data/reports/ || {
            echo '::error::CA9 self-check report is stale';
            echo 'Regenerate and commit it (tools/cosmic-data).';
            exit 1;
          }
      - name: Upload failure artifacts
        if: failure()
        # v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-smoke-artifacts
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore

  dependency-review:
    # O-03/2.6: production-dependency review on pull requests.
    name: dependency review (production scope)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      # v4.7.1
      # Immutable SHA pin: the action ref is an unbreakable 73-char token
      # (no YAML wrapping can fit it in 80 columns).
      # yamllint disable-line rule:line-length
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          scope: runtime
