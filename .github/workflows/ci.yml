name: CI

on:
  push:
    branches: [main]
  pull_request:

# O-03/2.1: least-privilege workflow token — the jobs only read the repo.
permissions:
  contents: read

# O-03/2.2: one in-flight run per ref; superseded pushes cancel.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    # Deterministic non-GPU gates only. A green run here says nothing about
    # GPU/WebGPU behavior (docs/CI_CD.md section 16).
    name: quality (format/lint/typecheck/unit/build)
    runs-on: ubuntu-latest
    # O-03/2.3: a hung job fails loudly instead of burning the six-hour cap.
    timeout-minutes: 30
    steps:
      # O-03/2.4: actions pinned to immutable commit SHAs (floating tags move);
      # Dependabot keeps the pins current (2.5).
      # v4.2.2
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          # O-03/2.7: pinned to a specific minor, not a floating major.
          node-version: 22.12.0
          cache: npm
      - name: Install from lockfile
        run: npm ci
      - name: Dependency audit gate (high+; see docs/DEPENDENCIES.md)
        run: npm audit --audit-level=high
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - name: Unit-test import-coverage report (report-only, D8/V-10)
        run: npm run coverage:report
      - name: Command-surface check (documented commands must exist)
        run: node scripts/check-command-surface.mjs
      - run: npm run build

  browser-smoke:
    # O-03/2.3: bounded job runtime.
    timeout-minutes: 30
    # Reliable hosted browser gate: the M0 backend-agnostic smoke on Chromium.
    #
    # WHY ONLY THE SMOKE (not the full behavioral/parity/golden suite): hosted
    # GitHub runners have no GPU, so every scene renders through software WebGL2
    # (SwiftShader) on 2 vCPUs. The heavy TSL lensing/Kerr shaders and the
    # full-screen hyperspace transition compile/render at seconds-per-frame, and
    # runner speed varies wildly run-to-run (a black-hole arrival measured
    # 18s in
    # one hosted run and >180s in another). No fixed timeout survives that
    # variance, so the full GPU suite CANNOT be a stable hosted gate — it is a
    # LOCAL capable-runner gate (docs/CI_CD.md sections 2, 7, 16; run it with
    # `npm run e2e` on a WebGPU-capable machine, plus `--project=firefox`).
    #
    # smoke.spec.ts boots the ROOT experience, which renders the CHEAP
    # diagnostic
    # gradient (no lensing/Kerr compile), plus the forced-WebGL2 gradient and
    # the
    # forced-unsupported terminal UX. It is backend-agnostic and cheap, so it is
    # stable on software WebGL2 while still proving: the app boots to a truthful
    # ready/fallback/unsupported terminal state, the WebGL2 fallback path
    # renders,
    # the canvas is non-zero, interaction/resize are safe, and the console/page
    # error channels stay clean (docs/CI_CD.md section 5). It is NOT a WebGPU or
    # full-scene validation.
    name: browser-smoke (Chromium, WebGL2 fallback; M0 boot/fallback smoke)
    needs: quality
    runs-on: ubuntu-latest
    steps:
      # v4.2.2
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - name: Install pinned Playwright browser (Chromium)
        run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Playwright M0 smoke (backend-agnostic)
        run: >-
          npx playwright test --project=default --workers=1
          tests/browser/smoke.spec.ts
          --reporter=json > smoke-results.json
      - name: Assert smoke coverage (a skip is not a pass)
        run: node scripts/check-smoke-coverage.mjs smoke-results.json 5
      - name: GC1 offline self-check + artifact freshness gate (pure-stdlib, D7)
        run: |
          python tools/cosmic-data/restricted_three_body.py
          git diff --exit-code tools/cosmic-data/reports/ || {
            echo '::error::CA9 self-check report is stale';
            echo 'Regenerate and commit it (tools/cosmic-data).';
            exit 1;
          }
      - name: Upload failure artifacts
        if: failure()
        # v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-smoke-artifacts
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore

  dependency-review:
    # O-03/2.6: production-dependency review on pull requests.
    name: dependency review (production scope)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # v4.2.2
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # v4.7.1
      # Immutable SHA pin: the action ref is an unbreakable 73-char token
      # (no YAML wrapping can fit it in 80 columns).
      # yamllint disable-line rule:line-length
      - uses: actions/dependency-review-action@da24556b548a50705dd671f47852072ea4c105d9
        with:
          scope: runtime
