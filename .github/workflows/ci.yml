name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    # Deterministic non-GPU gates only. A green run here says nothing about
    # GPU/WebGPU behavior (docs/CI_CD.md section 16).
    name: quality (format/lint/typecheck/unit/build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install from lockfile
        run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  browser-fallback:
    # Hosted runners provide no representative WebGPU adapter. This job runs
    # the FULL Playwright `default` project on Chromium; tests that require
    # WebGPU adapt to the WebGL2 fallback path (they are not skipped). It is
    # therefore a broad fallback-suite run, NOT a curated smoke subset, and it
    # must never be read as a WebGPU validation. Full WebGPU/parity/golden
    # evidence is produced by local capable runners (docs/CI_CD.md §16).
    name: browser (Chromium, full suite; WebGL2 fallback)
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install pinned Playwright browser
        run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
