name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    # Deterministic non-GPU gates only. A green run here says nothing about
    # GPU/WebGPU behavior (docs/CI_CD.md section 16).
    name: quality (format/lint/typecheck/unit/build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install from lockfile
        run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  browser-smoke:
    # Reliable hosted browser gate: the M0 backend-agnostic smoke on Chromium.
    #
    # WHY ONLY THE SMOKE (not the full behavioral/parity/golden suite): hosted
    # GitHub runners have no GPU, so every scene renders through software WebGL2
    # (SwiftShader) on 2 vCPUs. The heavy TSL lensing/Kerr shaders and the
    # full-screen hyperspace transition compile/render at seconds-per-frame, and
    # runner speed varies wildly run-to-run (a black-hole arrival measured 18s in
    # one hosted run and >180s in another). No fixed timeout survives that
    # variance, so the full GPU suite CANNOT be a stable hosted gate — it is a
    # LOCAL capable-runner gate (docs/CI_CD.md sections 2, 7, 16; run it with
    # `npm run e2e` on a WebGPU-capable machine, plus `--project=firefox`).
    #
    # smoke.spec.ts boots the ROOT experience, which renders the CHEAP diagnostic
    # gradient (no lensing/Kerr compile), plus the forced-WebGL2 gradient and the
    # forced-unsupported terminal UX. It is backend-agnostic and cheap, so it is
    # stable on software WebGL2 while still proving: the app boots to a truthful
    # ready/fallback/unsupported terminal state, the WebGL2 fallback path renders,
    # the canvas is non-zero, interaction/resize are safe, and the console/page
    # error channels stay clean (docs/CI_CD.md section 5). It is NOT a WebGPU or
    # full-scene validation.
    name: browser-smoke (Chromium, WebGL2 fallback; M0 boot/fallback smoke)
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install pinned Playwright browser (Chromium)
        run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Playwright M0 smoke (backend-agnostic)
        run: npx playwright test --project=default --workers=1 tests/browser/smoke.spec.ts
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-artifacts
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
